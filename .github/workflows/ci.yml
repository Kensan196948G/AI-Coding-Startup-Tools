name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-node:
    name: Lint & schema & tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate config / prompts / migration / secrets
        run: npm run validate
      - name: Unit & integration tests
        run: npm test

  lint-shell:
    name: ShellCheck & Bats (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
      - name: ShellCheck
        run: shellcheck -x scripts/linux/*.sh scripts/linux/lib/*.sh
      - name: Syntax check
        run: bash -n scripts/linux/*.sh scripts/linux/lib/*.sh
      - name: Bats tests
        run: bats tests/bats/

  sandbox-security:
    name: Sandbox & provider security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and bubblewrap
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: DeepSeek-only semantic validation
        run: npm run validate:deepseek
      - name: Workspace and Sandbox denial tests
        run: npm run test:sandbox

  security:
    name: Secret scan & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret pattern scan
        run: node scripts/validation/scan-secrets.mjs
      - name: npm audit
        run: npm audit --audit-level=high

  migration-registry:
    name: Migration registry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate migration inventory
        run: node scripts/validation/validate-migration.mjs
