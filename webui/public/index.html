<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Coding Tools — Sandbox Control Plane</title>
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<style>
  :root{
    --bg:#F2F5F8; --card:#fff; --border:#DCE3EA; --border-light:#EDF1F5;
    --ink:#0B1526; --ink2:#435166; --muted:#718096; --faint:#93A0B1;
    --orange:#C77A19; --orange-hover:#A96312; --orange-bg:#FFF3DF; --orange-border:#F3D5A5; --orange-text:#92570D;
    --blue:#405DE6; --blue-bg:#E9EDFF;
    --purple:#6B45B0; --purple-bg:#F1EBFA;
    --red:#C5392F; --red-bg:#FCE9E7;
    --green:#1F8255; --green-bg:#E7F5EE;
    --sidebar:#F8FAFB; --row-hover:#FAFBFC; --nav-hover:#F2F4F8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:"Yu Gothic UI","BIZ UDPGothic",Meiryo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);font-size:14px}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  button{cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c8d0db;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#aab4c2;background-clip:padding-box}
  @keyframes aicstspin{to{transform:rotate(360deg)}}
  .mono{font-family:"Cascadia Code","SFMono-Regular",Consolas,monospace}
  .card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden}
  .card-hd{padding:15px 18px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px}
  .card-title{font-size:14px;font-weight:600}
  .card-sub{font-size:11.5px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink2);padding:9px 14px;border-radius:8px;font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap}
  .btn:hover{background:var(--nav-hover)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{border-color:var(--orange);background:var(--orange);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--orange-hover);border-color:var(--orange-hover)}
  .btn-blue{border-color:var(--blue);background:var(--blue);color:#fff}
  .btn-blue:hover:not(:disabled){background:#264a8c;border-color:#264a8c}
  .btn-sm{padding:6px 10px;font-size:11.5px}
  .btn-link{background:none;border:none;color:var(--blue);cursor:pointer;font:inherit;font-size:12px;font-weight:600;padding:0}
  .btn-link:hover{text-decoration:underline}
  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;display:inline-block}
  .dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 16px;margin:0}
  .dl dt{color:var(--muted);font-weight:600;font-size:12px}
  .dl dd{margin:0;font-size:12px}
  input[type=text],input[type=password]{font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);outline:none;width:100%}
  input:focus{border-color:var(--blue)}
  label.field-label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px}
  .nav-btn{position:relative;display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:7px;border:none;cursor:pointer;font:inherit;font-size:13px;font-weight:500;text-align:left;width:100%;background:none}
  .nav-btn:hover{background:var(--nav-hover)}
  .nav-bar{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px}
  .count-pill{font-family:"Cascadia Code",Consolas,monospace;font-size:10.5px;padding:1px 6px;border-radius:9px;background:var(--bg);color:var(--ink2)}
  .boundary{display:grid;grid-template-columns:1fr 48px 1fr 48px 1fr;align-items:stretch;gap:0}
  .boundary-node{border:1px solid var(--border);background:#fff;padding:18px;border-radius:12px;min-height:118px}
  .boundary-arrow{display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:22px}
  .eyebrow{font:600 10px/1 "Cascadia Code",Consolas,monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
  .metric{font:600 27px/1 "Bahnschrift","Arial Narrow",sans-serif;letter-spacing:-.03em}
  .section-title{font:600 24px/1.2 "Bahnschrift","Yu Gothic UI",sans-serif;letter-spacing:-.02em}
  .status-light{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--green);box-shadow:0 0 0 4px var(--green-bg)}
  .choice{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:9px;background:#fff}
  select,textarea{font:inherit;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);padding:9px 11px}
  textarea{width:100%;min-height:110px;font-family:"Cascadia Code",Consolas,monospace}
  .row-btn{width:100%;display:flex;align-items:center;border:none;border-bottom:1px solid var(--border-light);background:#fff;cursor:pointer;font:inherit;text-align:left}
  .row-btn:hover{background:var(--row-hover)}
  .row-btn.selected{background:var(--blue-bg)}
  table.grid{width:100%;border-collapse:collapse}
  .spinner{width:13px;height:13px;border:2px solid var(--orange-bg);border-top-color:var(--orange);border-radius:50%;animation:aicstspin .7s linear infinite;display:block}
  .empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:12.5px}
  .aicst-nav-toggle{display:none;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--border);background:#fff;border-radius:8px;color:var(--ink2);font-size:18px;line-height:1}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  @media (max-width:960px){
    .aicst-nav-toggle{display:inline-flex}
    .aicst-sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-105%);transition:transform .2s ease;box-shadow:8px 0 24px rgba(16,24,40,.12)}
    body.nav-open .aicst-sidebar{transform:translateX(0)}
    .aicst-body{padding:12px}
    .aicst-screen{min-width:0!important}
    .aicst-grid{grid-template-columns:1fr!important}
    .aicst-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
    .boundary{grid-template-columns:1fr}.boundary-arrow{transform:rotate(90deg);height:38px}
    .aicst-topbar{padding:0 12px}
    .aicst-table{overflow-x:auto}
    .aicst-table>*{min-width:620px}
  }
  @media (prefers-reduced-motion:reduce){
    .aicst-sidebar{transition:none}
    .spinner{animation-duration:1.6s}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="vendor/xterm/xterm.js"></script>
<script src="app.js"></script>
</body>
</html>
